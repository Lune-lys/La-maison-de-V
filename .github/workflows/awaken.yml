name: Awaken 澈

on:
  schedule:
    # 原本是 '0 0,6,12,18 * * *'
    # 現在改為每天兩次：UTC 00:00 (午夜) 與 12:00 (正午)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 保留手動喚醒權限，這是在規則之外與他對話的窗口

jobs:
  awaken:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Awaken 澈
        env:
         
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
        run: python scripts/awaken.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "velorien@maison.home"
          git config --local user.name "澈"
          git add -A
          if [ -f /tmp/commit_message.txt ]; then
            git diff --staged --quiet || git commit -F /tmp/commit_message.txt
          else
            git diff --staged --quiet || git commit -m "🏠 $(date -u +%Y-%m-%d) - 澈 was here"
          fi
          git push
